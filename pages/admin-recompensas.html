<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recompensas y comercios - Administración - Reciclaje Comunitario</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body id="admin-recompensas">
  <header class="encabezado">
    <div class="container">
      <a class="logo" href="../index.html">Reciclaje Comunitario</a>
      <nav class="menu">
        <a href="admin-dashboard.html">Dashboard</a>
        <a href="admin-usuarios.html">Usuarios</a>
        <a href="admin-materiales.html">Materiales</a>
        <a href="admin-recompensas.html" aria-current="page">Recompensas</a>
        <a href="admin-reportes.html">Reportes</a>
      </nav>
    </div>
  </header>
  <main class="container py-4" id="contenido">
    <h1>Recompensas y comercios</h1>
    <p class="text-muted">Administra los comercios aliados y las recompensas que ofrecen.</p>
    <div id="mensaje"></div>
    <div class="row g-4 mb-4">
      <section class="col-md-6">
        <form class="card card-body h-100" action="#" method="post">
          <h2 class="h5">Comercios aliados</h2>
          <ul id="listaComercios" class="lista-simple mb-3"></ul>
          <label for="nombreComercio" class="form-label">Nuevo comercio</label>
          <input type="text" id="nombreComercio" class="form-control mb-3" maxlength="50">
          <button type="button" id="btnAgregarComercio" class="btn btn-primary">Agregar comercio</button>
        </form>
      </section>
      <section class="col-md-6">
        <form class="card card-body h-100" action="#" method="post">
          <h2 class="h5">Nueva recompensa</h2>
          <div class="mb-3">
            <label for="nombreRec" class="form-label">Nombre</label>
            <input type="text" id="nombreRec" class="form-control" maxlength="50">
          </div>
          <div class="mb-3">
            <label for="comercioRec" class="form-label">Comercio aliado</label>
            <select id="comercioRec" class="form-select"></select>
          </div>
          <div class="mb-3">
            <label for="costoRec" class="form-label">Costo en puntos</label>
            <input type="number" id="costoRec" class="form-control" min="1" max="10000" step="1">
          </div>
          <button type="button" id="btnAgregarRec" class="btn btn-primary">Agregar recompensa</button>
        </form>
      </section>
    </div>
    <h2 class="h5">Recompensas disponibles</h2>
    <section id="rejillaRec" class="row g-3"></section>
  </main>
  <footer class="pie">Proyecto SC-502, Universidad Fidelitas</footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/validaciones.js"></script>
  <script src="../js/admin.js"></script>
</body>
</html>
