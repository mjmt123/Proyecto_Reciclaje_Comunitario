<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catálogo de recompensas - Reciclaje Comunitario</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/reciclaje.css">
</head>
<body id="pagina-catalogo">
  <header class="encabezado">
    <div class="container">
      <a class="logo" href="../index.html">Reciclaje Comunitario</a>
      <nav class="menu">
        <a href="registrar-entrega.html">Registrar entrega</a>
        <a href="historial-entregas.html">Historial</a>
        <a href="mis-puntos.html">Mis puntos</a>
        <a href="catalogo-recompensas.html" aria-current="page">Recompensas</a>
        <a href="editar-perfil.html">Mi perfil</a>
        <a href="login.html">Ingresar</a>
        <a href="registro.html">Registrarse</a>
      </nav>
    </div>
  </header>
  <main class="container py-4">
    <h1>Catálogo de recompensas</h1>
    <p class="text-muted">Canjea tus puntos en comercios locales afiliados. Tu saldo: <strong id="saldo">0</strong> puntos.</p>
    <section class="row g-3 mb-4 align-items-end">
      <div class="col-sm-6 col-md-4">
        <label for="fCategoria" class="form-label">Categoría</label>
        <select id="fCategoria" class="form-select"></select>
      </div>
      <div class="col-sm-6 col-md-4">
        <p class="form-label mb-1">Ordenar por costo</p>
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="radio" name="orden" id="ordAsc" checked>
          <label class="form-check-label" for="ordAsc">Menor a mayor</label>
        </div>
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="radio" name="orden" id="ordDesc">
          <label class="form-check-label" for="ordDesc">Mayor a menor</label>
        </div>
      </div>
      <div class="col-md-4">
        <div class="form-check form-switch">
          <input class="form-check-input" type="checkbox" role="switch" id="soloPuedo">
          <label class="form-check-label" for="soloPuedo">Solo las que puedo canjear</label>
        </div>
      </div>
    </section>
    <section id="rejilla" class="row g-3"></section>
  </main>
  <footer class="pie">Proyecto SC-502, Universidad Fidelitas</footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/reciclaje.js"></script>
</body>
</html>
