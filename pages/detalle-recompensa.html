<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Detalle de recompensa - Reciclaje Comunitario</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/reciclaje.css">
</head>
<body id="pagina-detalle">
  <header class="encabezado">
    <div class="container">
      <a class="logo" href="../index.html">Reciclaje Comunitario</a>
      <nav class="menu">
        <a href="registrar-entrega.html">Registrar entrega</a>
        <a href="historial-entregas.html">Historial</a>
        <a href="mis-puntos.html">Mis puntos</a>
        <a href="catalogo-recompensas.html" aria-current="page">Recompensas</a>
      </nav>
    </div>
  </header>
  <main class="container py-4">
    <p><a href="catalogo-recompensas.html">Volver al catálogo</a></p>
    <div id="contenido" class="row g-4">
      <article class="col-md-7">
        <div class="card card-body">
          <div class="icono" id="icono"></div>
          <h1 class="h3" id="nombre"></h1>
          <p class="text-muted" id="comercio"></p>
          <p id="descripcion"></p>
          <h2 class="h5">Condiciones</h2>
          <ul id="condiciones"></ul>
        </div>
      </article>
      <aside class="col-md-5">
        <div class="card card-body">
          <p>Costo: <strong id="costo"></strong> puntos</p>
          <p>Tu saldo: <strong id="saldo"></strong> puntos</p>
          <p id="faltan" class="small"></p>
          <button type="button" id="btnCanjear" class="btn btn-warning">Canjear recompensa</button>
          <div id="confirmacion" class="mt-3"></div>
        </div>
      </aside>
    </div>
  </main>
  <footer class="pie">Proyecto SC-502, Universidad Fidelitas</footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/reciclaje.js"></script>
</body>
</html>
