<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registro de centro - Reciclaje Comunitario</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/centros.css">
</head>
<body id="pagina-centro-form">
  <header class="encabezado">
    <div class="container">
      <a class="logo" href="../index.html">Reciclaje Comunitario</a>
      <nav class="menu">
        <a href="registrar-entrega.html">Registrar entrega</a>
        <a href="historial-entregas.html">Historial</a>
        <a href="mis-puntos.html">Mis puntos</a>
        <a href="catalogo-recompensas.html">Recompensas</a>
        <a href="centros.html" aria-current="page">Centros</a>
        <a href="rutas.html">Rutas</a>
        <a href="editar-perfil.html">Mi perfil</a>
        <a href="login.html">Ingresar</a>
        <a href="registro.html">Registrarse</a>
      </nav>
    </div>
  </header>
  <main class="container py-4">
    <div class="row justify-content-center">
      <section class="col-md-9 col-lg-7">
        <h1 id="titulo">Registrar centro de acopio</h1>
        <div id="mensaje"></div>
        <form id="formCentro" class="card card-body" action="#" method="post" novalidate>
          <div class="mb-3">
            <label for="nombre" class="form-label">Nombre del centro</label>
            <input type="text" id="nombre" class="form-control" maxlength="80">
          </div>
          <div class="row">
            <div class="col-sm-6 mb-3">
              <label for="zona" class="form-label">Zona</label>
              <select id="zona" class="form-select"></select>
            </div>
            <div class="col-sm-6 mb-3">
              <label for="telefono" class="form-label">Teléfono</label>
              <input type="text" id="telefono" class="form-control" placeholder="2222-1111">
            </div>
          </div>
          <div class="mb-3">
            <label for="direccion" class="form-label">Dirección o señas</label>
            <input type="text" id="direccion" class="form-control" maxlength="150">
          </div>
          <div class="mb-3">
            <label for="horario" class="form-label">Horario de atención</label>
            <input type="text" id="horario" class="form-control" placeholder="Lun a Vie, 8:00 a 16:00">
          </div>
          <div class="mb-3">
            <span class="form-label d-block">Materiales aceptados</span>
            <div id="materiales"></div>
          </div>
          <div>
            <button type="submit" class="btn btn-primary">Guardar centro</button>
            <a class="btn btn-outline-secondary ms-2" href="centros.html">Cancelar</a>
          </div>
        </form>
      </section>
    </div>
  </main>
  <footer class="pie">Proyecto SC-502, Universidad Fidelitas</footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/centros.js"></script>
</body>
</html>
