<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recuperar contraseña - Reciclaje Comunitario</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/global.css">
</head>
<body id="pagina-recuperar">
  <header class="encabezado">
    <div class="container">
      <a class="logo" href="../index.html">Reciclaje Comunitario</a>
      <nav class="menu">
        <a href="registrar-entrega.html">Registrar entrega</a>
        <a href="historial-entregas.html">Historial</a>
        <a href="mis-puntos.html">Mis puntos</a>
        <a href="catalogo-recompensas.html">Recompensas</a>
        <a href="editar-perfil.html">Mi perfil</a>
        <a href="login.html">Ingresar</a>
        <a href="registro.html">Registrarse</a>
      </nav>
    </div>
  </header>
  <main class="container py-4">
    <div class="row justify-content-center">
      <section class="col-md-8 col-lg-5">
        <h1>Recuperar contraseña</h1>
        <p class="text-muted">Escribe tu correo y te enviaremos un código de verificación.</p>
        <div id="mensaje"></div>

        <form id="formSolicitar" class="card card-body mb-3" action="#" method="post" novalidate>
          <div class="mb-3">
            <label for="correoRec" class="form-label">Correo electrónico</label>
            <input type="email" id="correoRec" class="form-control" autocomplete="email">
          </div>
          <button type="submit" id="btnCodigo" class="btn btn-primary">Enviar código</button>
        </form>

        <form id="formRestablecer" class="card card-body d-none" action="#" method="post" novalidate>
          <div class="mb-3">
            <label for="codigo" class="form-label">Código de verificación</label>
            <input type="text" id="codigo" class="form-control" maxlength="6" inputmode="numeric" placeholder="6 dígitos" autocomplete="one-time-code">
          </div>
          <div class="mb-3">
            <label for="claveNueva" class="form-label">Nueva contraseña</label>
            <input type="password" id="claveNueva" class="form-control" autocomplete="new-password">
            <div class="form-text">Mínimo 8 caracteres, con letras y números.</div>
          </div>
          <div class="mb-3">
            <label for="claveNueva2" class="form-label">Confirmar nueva contraseña</label>
            <input type="password" id="claveNueva2" class="form-control" autocomplete="new-password">
          </div>
          <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" id="verClave">
            <label class="form-check-label" for="verClave">Mostrar contraseñas</label>
          </div>
          <button type="submit" id="btnRestablecer" class="btn btn-primary">Cambiar contraseña</button>
        </form>

        <p class="mt-3"><a href="login.html">Volver a iniciar sesión</a></p>
      </section>
    </div>
  </main>
  <footer class="pie">Proyecto SC-502, Universidad Fidelitas</footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/usuarios.js"></script>
</body>
</html>
