<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión - Reciclaje Comunitario</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/global.css">
</head>
<body id="pagina-login">
  <header class="encabezado">
    <div class="container">
      <a class="logo" href="../index.html">Reciclaje Comunitario</a>
      <nav class="menu">
        <a href="registrar-entrega.html">Registrar entrega</a>
        <a href="historial-entregas.html">Historial</a>
        <a href="mis-puntos.html">Mis puntos</a>
        <a href="catalogo-recompensas.html">Recompensas</a>
        <a href="editar-perfil.html">Mi perfil</a>
        <a href="login.html" aria-current="page">Ingresar</a>
        <a href="registro.html">Registrarse</a>
      </nav>
    </div>
  </header>
  <main class="container py-4">
    <div class="row justify-content-center">
      <section class="col-md-8 col-lg-5">
        <h1>Iniciar sesión</h1>
        <p class="text-muted">Entra para ver tus puntos y canjear recompensas.</p>
        <div id="mensaje"></div>
        <form id="formLogin" class="card card-body" action="#" method="post" novalidate>
          <div class="mb-3">
            <label for="correoLogin" class="form-label">Correo electrónico</label>
            <input type="email" id="correoLogin" class="form-control" autocomplete="email">
          </div>
          <div class="mb-3">
            <label for="claveLogin" class="form-label">Contraseña</label>
            <input type="password" id="claveLogin" class="form-control" autocomplete="current-password">
          </div>
          <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" id="verClave">
            <label class="form-check-label" for="verClave">Mostrar contraseña</label>
          </div>
          <button type="submit" id="btnLogin" class="btn btn-primary">Ingresar</button>
          <p class="mt-3 mb-1"><a href="recuperar-contrasena.html">¿Olvidaste tu contraseña?</a></p>
          <p class="mb-0">¿No tienes cuenta? <a href="registro.html">Regístrate</a></p>
        </form>
      </section>
    </div>
  </main>
  <footer class="pie">Proyecto SC-502, Universidad Fidelitas</footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/usuarios.js"></script>
</body>
</html>
