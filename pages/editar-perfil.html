<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mi perfil - Reciclaje Comunitario</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/global.css">
</head>
<body id="pagina-perfil">
  <header class="encabezado">
    <div class="container">
      <a class="logo" href="../index.html">Reciclaje Comunitario</a>
      <nav class="menu">
        <a href="registrar-entrega.html">Registrar entrega</a>
        <a href="historial-entregas.html">Historial</a>
        <a href="mis-puntos.html">Mis puntos</a>
        <a href="catalogo-recompensas.html">Recompensas</a>
        <a href="editar-perfil.html" aria-current="page">Mi perfil</a>
        <a href="login.html">Ingresar</a>
        <a href="registro.html">Registrarse</a>
      </nav>
    </div>
  </header>
  <main class="container py-4">
    <div class="row justify-content-center">
      <section class="col-md-9 col-lg-7">
        <h1>Mi perfil</h1>
        <p class="text-muted" id="saludoPerfil">Actualiza tus datos personales.</p>
        <div id="mensaje"></div>
        <form id="formPerfil" class="card card-body" action="#" method="post" novalidate>
          <div class="mb-3">
            <label for="correoPerfil" class="form-label">Correo electrónico</label>
            <input type="email" id="correoPerfil" class="form-control" readonly>
            <div class="form-text">El correo no se puede cambiar.</div>
          </div>
          <div class="mb-3">
            <label for="nombrePerfil" class="form-label">Nombre completo</label>
            <input type="text" id="nombrePerfil" class="form-control" maxlength="80">
          </div>
          <div class="row">
            <div class="col-sm-6 mb-3">
              <label for="zonaPerfil" class="form-label">Zona</label>
              <select id="zonaPerfil" class="form-select"></select>
            </div>
            <div class="col-sm-6 mb-3">
              <label for="direccionPerfil" class="form-label">Dirección (opcional)</label>
              <input type="text" id="direccionPerfil" class="form-control" maxlength="150">
            </div>
          </div>
          <hr>
          <h2 class="h5">Cambiar contraseña (opcional)</h2>
          <p class="text-muted small">Déjalo en blanco si no quieres cambiarla.</p>
          <div class="mb-3">
            <label for="claveActual" class="form-label">Contraseña actual</label>
            <input type="password" id="claveActual" class="form-control" autocomplete="current-password">
          </div>
          <div class="row">
            <div class="col-sm-6 mb-3">
              <label for="claveNueva" class="form-label">Nueva contraseña</label>
              <input type="password" id="claveNueva" class="form-control" autocomplete="new-password">
            </div>
            <div class="col-sm-6 mb-3">
              <label for="claveNueva2" class="form-label">Confirmar nueva contraseña</label>
              <input type="password" id="claveNueva2" class="form-control" autocomplete="new-password">
            </div>
          </div>
          <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" id="verClave">
            <label class="form-check-label" for="verClave">Mostrar contraseñas</label>
          </div>
          <div>
            <button type="submit" id="btnGuardar" class="btn btn-primary">Guardar cambios</button>
            <button type="button" id="btnSalir" class="btn btn-outline-secondary ms-2">Cerrar sesión</button>
          </div>
        </form>
      </section>
    </div>
  </main>
  <footer class="pie">Proyecto SC-502, Universidad Fidelitas</footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/usuarios.js"></script>
</body>
</html>
