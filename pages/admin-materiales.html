<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catálogo de materiales - Administración - Reciclaje Comunitario</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body id="admin-materiales">
  <header class="encabezado">
    <div class="container">
      <a class="logo" href="../index.html">Reciclaje Comunitario</a>
      <nav class="menu">
        <a href="admin-dashboard.html">Dashboard</a>
        <a href="admin-usuarios.html">Usuarios</a>
        <a href="admin-materiales.html" aria-current="page">Materiales</a>
        <a href="admin-recompensas.html">Recompensas</a>
        <a href="admin-reportes.html">Reportes</a>
      </nav>
    </div>
  </header>
  <main class="container py-4" id="contenido">
    <h1>Catálogo de materiales</h1>
    <p class="text-muted">Define qué materiales se aceptan y cuántos puntos vale cada kilogramo.</p>
    <div id="mensaje"></div>
    <div class="row g-4">
      <section class="col-md-5">
        <form class="card card-body" action="#" method="post">
          <h2 class="h5">Agregar material</h2>
          <div class="mb-3">
            <label for="nombreMat" class="form-label">Nombre</label>
            <input type="text" id="nombreMat" class="form-control" maxlength="40" placeholder="Ej. Latas de acero">
          </div>
          <div class="mb-3">
            <label for="puntosMat" class="form-label">Puntos por kg</label>
            <input type="number" id="puntosMat" class="form-control" min="1" max="1000" step="1">
          </div>
          <button type="button" id="btnAgregarMat" class="btn btn-primary">Agregar material</button>
        </form>
      </section>
      <section class="col-md-7">
        <div class="card card-body">
          <h2 class="h5">Materiales aceptados</h2>
          <ul id="listaMateriales" class="lista-simple"></ul>
        </div>
      </section>
    </div>
  </main>
  <footer class="pie">Proyecto SC-502, Universidad Fidelitas</footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/validaciones.js"></script>
  <script src="../js/admin.js"></script>
</body>
</html>
