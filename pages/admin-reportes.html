<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reportes - Administración - Reciclaje Comunitario</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body id="admin-reportes">
  <header class="encabezado">
    <div class="container">
      <a class="logo" href="../index.html">Reciclaje Comunitario</a>
      <nav class="menu">
        <a href="admin-dashboard.html">Dashboard</a>
        <a href="admin-usuarios.html">Usuarios</a>
        <a href="admin-materiales.html">Materiales</a>
        <a href="admin-recompensas.html">Recompensas</a>
        <a href="admin-reportes.html" aria-current="page">Reportes</a>
      </nav>
    </div>
  </header>
  <main class="container py-4" id="contenido">
    <h1>Reportes de reciclaje</h1>
    <p class="text-muted">Consulta el material reciclado filtrando por fecha, zona y tipo de material.</p>
    <div id="mensaje"></div>
    <form class="card card-body mb-4" action="#" method="post">
      <div class="row g-3">
        <div class="col-sm-6 col-md-3">
          <label for="desde" class="form-label">Desde</label>
          <input type="date" id="desde" class="form-control">
        </div>
        <div class="col-sm-6 col-md-3">
          <label for="hasta" class="form-label">Hasta</label>
          <input type="date" id="hasta" class="form-control">
        </div>
        <div class="col-sm-6 col-md-3">
          <label for="zona" class="form-label">Zona</label>
          <select id="zona" class="form-select"></select>
        </div>
        <div class="col-sm-6 col-md-3">
          <label for="material" class="form-label">Material</label>
          <select id="material" class="form-select"></select>
        </div>
      </div>
      <div class="mt-3"><button type="button" id="btnGenerar" class="btn btn-primary">Generar reporte</button></div>
    </form>
    <section id="resultado"></section>
  </main>
  <footer class="pie">Proyecto SC-502, Universidad Fidelitas</footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/validaciones.js"></script>
  <script src="../js/admin.js"></script>
</body>
</html>
